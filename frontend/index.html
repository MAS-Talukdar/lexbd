
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bangladesh Case Law Directory</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <header class="bg-slate-950 text-white">
    <div class="max-w-7xl mx-auto px-6 py-5">

      <h1 class="text-2xl font-bold">
        Bangladesh Case Law Directory
      </h1>

      <p class="text-slate-300 mt-2">
        A Digital Repository of Bangladesh Judgments
      </p>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-16">

    <section class="bg-white rounded-xl shadow-sm p-8">

      <h2 class="text-3xl font-bold text-slate-900">
        Welcome to Case Law Directory
      </h2>

      <p class="text-slate-600 mt-4">
        Search, explore and read published judgments
        of Bangladesh Courts.
      </p>

      <div class="mt-8">

        <h3 class="font-semibold text-slate-800">
          Backend Connection Status
        </h3>

        <p
          id="connection-status"
          class="mt-3 text-slate-500"
        >
          Checking server connection...
        </p>

      </div>

    </section>

  </main>

  <script src="./js/app.js"></script>

</body>
</html>
