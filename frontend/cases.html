
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Law Directory | LEXBD</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="./index.html" class="text-2xl font-bold text-blue-950">
                LEXBD
            </a>

            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="./index.html" class="hover:text-blue-700">Home</a>
                <a href="./cases.html" class="text-blue-700">Case Law</a>
                <a href="./index.html#about" class="hover:text-blue-700">About</a>
                <a href="./login.html" class="hover:text-blue-700">Login</a>
            </nav>

        </div>
    </header>

    <!-- Page Heading -->
    <section class="bg-blue-950 text-white py-12">
        <div class="max-w-7xl mx-auto px-6">
            <h1 class="text-3xl md:text-4xl font-bold">
                Bangladesh Case Law Directory
            </h1>

            <p class="mt-3 text-blue-100">
                Search and explore published judgments of Bangladesh.
            </p>
        </div>
    </section>

    <!-- Search Section -->
    <main class="max-w-7xl mx-auto px-6 py-10">

        <section class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">

            <h2 class="text-xl font-semibold mb-4">
                Search Cases
            </h2>

            <form id="caseSearchForm" class="flex flex-col md:flex-row gap-3">

                <input
                    type="search"
                    id="caseSearchInput"
                    placeholder="Search by case title, parties, citation or keywords..."
                    class="flex-1 border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                >

                <button
                    type="submit"
                    class="bg-blue-950 text-white px-8 py-3 rounded-lg hover:bg-blue-900"
                >
                    Search
                </button>

            </form>


<!-- Advanced Search Filters -->
<div class="mt-6 border-t border-slate-200 pt-5">

    <h3 class="font-semibold text-slate-800 mb-4">
        Advanced Filters
    </h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">

        <!-- Court -->
        <div>
            <label for="filterCourt" class="block text-sm font-medium mb-2">
                Court
            </label>

            <select
                id="filterCourt"
                class="w-full border border-slate-300 rounded-lg px-3 py-3 bg-white"
            >
                <option value="">All Courts</option>
            </select>
        </div>

        <!-- Judge -->
        <div>
            <label for="filterJudge" class="block text-sm font-medium mb-2">
                Judge
            </label>

            <select
                id="filterJudge"
                class="w-full border border-slate-300 rounded-lg px-3 py-3 bg-white"
            >
                <option value="">All Judges</option>
            </select>
        </div>

        <!-- Legal Topic -->
        <div>
            <label for="filterTopic" class="block text-sm font-medium mb-2">
                Legal Topic
            </label>

            <select
                id="filterTopic"
                class="w-full border border-slate-300 rounded-lg px-3 py-3 bg-white"
            >
                <option value="">All Topics</option>
            </select>
        </div>

        <!-- Legislation -->
        <div>
            <label for="filterLegislation" class="block text-sm font-medium mb-2">
                Legislation
            </label>

            <select
                id="filterLegislation"
                class="w-full border border-slate-300 rounded-lg px-3 py-3 bg-white"
            >
                <option value="">All Legislation</option>
            </select>
        </div>

        <!-- Year -->
        <div>
            <label for="filterYear" class="block text-sm font-medium mb-2">
                Decision Year
            </label>

            <input
                type="number"
                id="filterYear"
                placeholder="e.g. 2024"
                min="1800"
                max="2100"
                class="w-full border border-slate-300 rounded-lg px-3 py-3"
            >
        </div>

    </div>

    <div class="flex flex-wrap gap-3 mt-5">

        <button
            type="button"
            id="applyFiltersButton"
            class="bg-blue-950 text-white px-6 py-2.5 rounded-lg hover:bg-blue-900"
        >
            Apply Filters
        </button>

        <button
            type="button"
            id="clearFiltersButton"
            class="border border-slate-300 px-6 py-2.5 rounded-lg hover:bg-slate-100"
        >
            Clear Filters
        </button>

    </div>

</div>


        </section>

        <!-- Results Information -->
        <section class="mt-8">

            <div class="flex flex-col sm:flex-row justify-between gap-3 items-start sm:items-center mb-5">

                <div>
                    <h2 class="text-xl font-semibold">
                        Published Cases
                    </h2>

                    <p id="caseResultInfo" class="text-sm text-slate-500 mt-1">
                        Loading cases...
                    </p>
                </div>

                <button
                    type="button"
                    id="refreshCasesButton"
                    class="border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-100 text-sm"
                >
                    Refresh
                </button>

            </div>

            <!-- Cases Container -->
            <div id="directoryCases" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <div class="col-span-full bg-white border rounded-xl p-8 text-center text-slate-500">
                    Loading published cases...
                </div>

            </div>

            <!-- Pagination -->
            <div id="casePagination" class="flex justify-center items-center gap-3 mt-10">
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-blue-950 text-white mt-16">
        <div class="max-w-7xl mx-auto px-6 py-8 text-center">

            <p class="font-semibold text-lg">LEXBD</p>

            <p class="text-sm text-blue-200 mt-2">
                Bangladesh Case Law Directory
            </p>

            <p class="text-xs text-blue-300 mt-4">
                © <span id="currentYear"></span> LEXBD. All rights reserved.
            </p>

        </div>
    </footer>

    <script src="./js/api.js"></script>
    <script src="./js/cases.js"></script>

</body>
</html>
