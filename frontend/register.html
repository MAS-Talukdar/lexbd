
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LEXBD</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">

    <main class="w-full max-w-md">

        <div class="text-center mb-8">
            <a href="./index.html"
               class="text-3xl font-bold text-[#001233]">
                LEX<span class="text-[#A37A00]">BD</span>
            </a>

            <h1 class="text-2xl font-bold text-slate-800 mt-6">
                Create Your Account
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Join LEXBD and explore Bangladesh case law.
            </p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-7">

            <div id="message"
                 class="hidden mb-5 p-3 rounded-lg text-sm">
            </div>

            <form id="registerForm" class="space-y-5">

                <div>
                    <label for="name"
                           class="block text-sm font-medium text-slate-700 mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        required
                        autocomplete="name"
                        placeholder="Enter your full name"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-[#001233]"
                    >
                </div>

                <div>
                    <label for="email"
                           class="block text-sm font-medium text-slate-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="255"
                        required
                        autocomplete="email"
                        placeholder="you@example.com"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-[#001233]"
                    >
                </div>

                <div>
                    <label for="password"
                           class="block text-sm font-medium text-slate-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="12"
                        maxlength="72"
                        required
                        autocomplete="new-password"
                        placeholder="At least 12 characters"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-[#001233]"
                    >

                    <p class="text-xs text-slate-500 mt-2">
                        Use at least 12 characters.
                    </p>
                </div>

                <div>
                    <label for="confirmPassword"
                           class="block text-sm font-medium text-slate-700 mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="12"
                        maxlength="72"
                        required
                        autocomplete="new-password"
                        placeholder="Enter password again"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-[#001233]"
                    >
                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="w-full bg-[#001233] hover:bg-[#00204d] text-white font-semibold py-3 rounded-lg transition">
                    Create Account
                </button>

            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
                Already have an account?
                <a href="./login.html"
                   class="text-[#A37A00] font-semibold hover:underline">
                    Login
                </a>
            </div>

        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            © <span id="currentYear"></span> LEXBD. All rights reserved.
        </p>

    </main>

    <script src="./js/api.js"></script>
    <script src="./js/register.js"></script>

</body>
</html>
